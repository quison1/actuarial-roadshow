# ---------------------------------------------------------------------------
# Deck variants
#
# Every optional part of the deck has an on/off switch under `show:` below.
# These are the defaults. To change them for one session, either edit them
# here, or render with a profile that overrides a few of them:
#
#   quarto render can-you-price-the-future.qmd                       # defaults
#   quarto render can-you-price-the-future.qmd --profile no-phones   # one profile
#   quarto render can-you-price-the-future.qmd --profile no-photo,no-phones
#
# Profiles live in _quarto-<name>.yml next to this file. To add one, copy an
# existing profile, rename it, and list only the switches it changes.
#
# Leave these switches out of the deck's own front matter: settings there win
# over profiles, so a profile could no longer change them.
# ---------------------------------------------------------------------------
project:
  type: default
  render:
    - can-you-price-the-future.qmd   # slides/ and archive/ are included pieces, not decks

show:
  scoreboard: false          # live team scoreboard during the game
  winner: false              # winner announcement (reads the scoreboard, so needs it on)
  dice-qr: true              # QR code to the on-screen dice page, on the rules slide
  testimonial: true          # "In a student's words" slide
  testimonial-photo: true    # student photo on that slide (quotes go full width without it)
  backup: true               # "Backup slides" divider and the maths requirement slide
  backup-extra: false        # older backup slides: where actuaries work, ANU, careers
