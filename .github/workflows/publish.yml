name: Publish deck

on:
  push:
    branches: [main]
  workflow_dispatch:        # also allows a manual "Run workflow" button
    inputs:
      profile:
        description: "Deck profile(s) to publish, e.g. no-photo or no-photo,no-phones (blank = defaults in _quarto.yml)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.37   # same as your local Quarto
      - name: Render the deck
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          if [ -n "$PROFILE" ]; then
            quarto render can-you-price-the-future.qmd --profile "$PROFILE"
          else
            quarto render can-you-price-the-future.qmd
          fi
          mkdir _site
          cp can-you-price-the-future.html _site/index.html
          cp dice.html _site/dice.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4